<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024">
  <!-- Icône Windows statique : vert Akta historique, sans liseré extérieur. -->
  <defs>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="27" y1="93" x2="105" y2="23">
      <stop stop-color="#10b981"/><stop offset="1" stop-color="#28ce91"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="35" y1="75" x2="93" y2="75">
      <stop stop-color="#10b981"/>
      <stop offset=".42" stop-color="#10b981"/>
      <stop offset=".54" stop-color="#68dca5"/>
      <stop offset="1" stop-color="#86e5ba"/>
    </linearGradient>
    <filter id="pulse-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="29" fill="#0b1328"/>
  <path d="M 27.5 89 A 45 45 0 1 1 100.5 89"
    fill="none" stroke="url(#ring)" stroke-width="7.6" stroke-linecap="round"/>
  <circle cx="94" cy="34" r="5.4" fill="white"/>
  <path d="M 35 101 L 60 53 Q 64 45 68 53 L 93 101"
    fill="none" stroke="url(#mark)" stroke-width="17"
    stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 28 81 H 61 L 65 72 L 70 89 L 75 81 H 100"
    fill="none" stroke="white" stroke-width="7" opacity=".35"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#pulse-glow)"/>
  <path d="M 28 81 H 61 L 65 72 L 70 89 L 75 81 H 100"
    fill="none" stroke="white" stroke-width="3.8"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
